[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsquared"
requires-python = ">=3.10"
description = "A comprehensive nearest neighbors library for matrix completion with scalar and distributional entries"
version = "1.1.0"
authors = [
    {name="Aashish Khubchandani", email="akk223@cornell.edu"},
    {name="Albert Gong", email="agong@cs.cornell.edu"},
    {name="Caleb Chin", email="ctc92@cornell.edu"},
    {name="Harshvardan Maskara", email="hm475@cornell.edu"},
    {name="Jacob Feitelberg", email="jef2182@columbia.edu"},
    {name="Kyuseong Choi", email="kc728@cornell.edu"},
    {name="Manit Paul", email="paulman@wharton.upenn.edu"},
    {name="Raaz Dwivedi", email="dwivedi@cornell.edu"},
    {name="Tathagata Sadhukhan", email="ts767@cornell.edu"},
]
readme = "README.md"
license = "MIT"
keywords = ["machine learning", "matrix completion", "nearest neighbors", "imputation", "causal inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Kept deliberately small: what the imputers and their cross-validation need,
# and nothing else. Everything for the bundled datasets, baselines, plotting,
# and example scripts lives in an extra below.
dependencies = [
    "numpy",
    "hyperopt",  # threshold search in nsquared.fit_methods
    "tqdm",      # progress reporting in nsquared.estimation_methods
]

[project.optional-dependencies]
# The N^2-Bench data loaders (nsquared.datasets). Needed for
# NNData.create("heartsteps"), ("movielens"), ("prompteval"), ("prop99").
# The synthetic loader needs no extra.
data = [
    "pandas",
    "joblib",
    "requests",
    "datasets",
]
# Classical non-NN baselines (nsquared.baselines.softimpute).
# fancyimpute 0.7.0 calls sklearn.utils.check_array(force_all_finite=...), which
# scikit-learn deprecated in 1.6 and removed in 1.8, so SoftImpute raises
# TypeError on newer scikit-learn. Pin until fancyimpute ships a fix.
baselines = [
    "fancyimpute",
    "scikit-learn<1.8",
]
# Plot styling helpers (nsquared.utils.plotting_utils).
plots = [
    "matplotlib",
]
# Everything the scripts under examples/ and bench/ import.
examples = [
    "nsquared[data,baselines,plots]",
    "seaborn",
    "tabulate",
    "SyntheticControlMethods",
    "wrds",
]
all = [
    "nsquared[examples]",
]
dev = [
    "nsquared[all]",
    "pre-commit",
    "ruff",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/aashish-khub/NearestNeighbors"
Documentation = "https://github.com/aashish-khub/NearestNeighbors/blob/main/README.md"
Repository = "https://github.com/aashish-khub/NearestNeighbors.git"
Issues = "https://github.com/aashish-khub/NearestNeighbors/issues"

[tool.setuptools.packages.find]
where = ["src"]
# Guard against shipping a top-level package alongside nsquared: a generic name
# like "baselines" would squat the importing user's namespace.
include = ["nsquared*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]

exclude = [
    ".git",
    "__pycache__",
    "unconsolidated_code/*",
    "docs/*",
]

